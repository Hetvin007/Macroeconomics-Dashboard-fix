# Release calendar is deliberately expectation-free. Add consensus only when a
# licensed/free source is available; the app labels consensus as user-supplied.
releases:
  - {country: India, event: CPI inflation, frequency: Monthly, source: MoSPI, source_url: https://www.mospi.gov.in/}
  - {country: India, event: IIP, frequency: Monthly, source: MoSPI, source_url: https://www.mospi.gov.in/}
